<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quill — trading desk with a checkpoint</title>
  <meta name="description" content="Ask in plain words. Quill reads live data, runs the Checkpoint, and hands you a ticket. Nothing moves until you sign.">
  <link rel="icon" href="/img/quill.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/desk" aria-label="Quill home">
      <img src="/img/quill.svg" alt="" width="26" height="26"><span>Quill</span>
    </a>
    <div class="topbar-mid">
      <label class="chain-pick">
        <span class="sr">Network</span>
        <select id="chain"></select>
      </label>
      <button class="ask" id="askBtn" type="button" title="Ask the agent (Ctrl/⌘ K)">Ask the agent <kbd>⌘K</kbd></button>
    </div>
    <div class="topbar-end">
      <span class="mode-pill" id="modePill" hidden></span>
      <button class="btn" id="walletBtn" type="button">Connect wallet</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <nav class="rail" aria-label="Sections">
    <a href="#/desk" data-route="desk"><i>◇</i><span>Desk</span></a>
    <a href="#/swap" data-route="swap"><i>⇄</i><span>Swap</span></a>
    <a href="#/check" data-route="check"><i>✓</i><span>Checkpoint</span></a>
    <a href="#/markets" data-route="markets"><i>▤</i><span>Perp data</span></a>
    <a href="#/limits" data-route="limits"><i>▣</i><span>Limits</span></a>
    <a href="#/journal" data-route="journal"><i>≡</i><span>Journal</span></a>
    <a href="#/api" data-route="api"><i>{}</i><span>API &amp; MCP</span></a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <aside class="drawer" id="drawer" aria-label="Agent chat" aria-hidden="true">
    <div class="drawer-head">
      <div><b>Agent</b> <span class="muted" id="chatMode"></span></div>
      <button class="icon-btn" id="drawerClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <form class="chat-form" id="chatForm">
      <textarea id="chatInput" rows="2" placeholder="swap 0.02 ETH to USDC · check 0x… · funding on BTC" maxlength="4000"></textarea>
      <button class="btn primary" type="submit">Send</button>
    </form>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
