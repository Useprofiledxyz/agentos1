<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quill — App</title>
  <meta name="description" content="Quill: the Robinhood Chain trading desk. Ask in plain words, review the Checkpoint, sign in your own wallet.">
  <meta name="theme-color" content="#060908">
  <link rel="icon" href="/img/quill.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <script>try { const t = localStorage.getItem("quill.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body class="app">
  <aside class="side" id="side">
    <a class="brand" href="/" aria-label="Quill home"><img src="/img/quill.svg" alt=""><span>Quill</span></a>
    <nav class="nav" aria-label="Sections">
      <div class="nav-group"><span>Overview</span>
        <a href="#/desk" data-route="desk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Desk</a>
      </div>
      <div class="nav-group"><span>Trade</span>
        <a href="#/swap" data-route="swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h12l-4-4M17 17H5l4 4"/></svg>Swap</a>
        <a href="#/check" data-route="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Checkpoint</a>
      </div>
      <div class="nav-group"><span>Markets</span>
        <a href="#/live" data-route="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/></svg>Onchain live <i class="badge">LIVE</i></a>
        <a href="#/new" data-route="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>New pairs</a>
        <a href="#/stocks" data-route="stocks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stocks</a>
      </div>
      <div class="nav-group"><span>You</span>
        <a href="#/portfolio" data-route="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18M7 6V4h10v2"/></svg>Portfolio</a>
        <a href="#/limits" data-route="limits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Limits</a>
        <a href="#/journal" data-route="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h11a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6"/></svg>Journal</a>
      </div>
      <div class="nav-group"><span>Build</span>
        <a href="#/api" data-route="api"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 4l-4 16"/></svg>API &amp; MCP</a>
      </div>
    </nav>
    <div class="side-foot">
      <button class="ca-chip ca-side" type="button" data-copy="0xa08021a09d71167a3acbc1b5f595dad9e042dc2b" title="Copy the $QUILL contract address"><b>$QUILL</b><span class="mono">0xa080…dc2b</span><i class="ca-copy" aria-hidden="true">⧉</i></button>
      <a href="/">← Quill home</a>
      <span class="faint mono" style="font-size:11px">Non-custodial · you sign every trade</span>
    </div>
  </aside>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
    <button class="ask" id="askBtn" type="button" title="Ask the agent (Ctrl/⌘ K)"><span class="nib">✎</span><span class="ask-text">Ask Quill to swap, check a coin, show trending…</span><kbd>⌘K</kbd></button>
    <div class="topbar-end">
      <a class="block-pill" id="blockPill" href="https://robinhoodchain.blockscout.com" target="_blank" rel="noopener" title="Connected live to Robinhood Chain"><i class="live-dot"></i><span id="blockNum">Robinhood Chain · live</span></a>
      <span class="mode-pill" id="modePill" hidden></span>
      <button class="btn primary sm" id="walletBtn" type="button">Connect wallet</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <aside class="drawer" id="drawer" aria-label="Agent chat" aria-hidden="true">
    <div class="drawer-head">
      <div><b>Ask Quill</b> <span class="muted mono" id="chatMode" style="font-size:12px"></span></div>
      <button class="icon-btn" id="drawerClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <form class="chat-form" id="chatForm">
      <textarea id="chatInput" rows="2" placeholder="buy TSLA with 0.01 ETH · check 0x… · what's trending?" maxlength="4000"></textarea>
      <button class="btn primary" type="submit">Send</button>
    </form>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
